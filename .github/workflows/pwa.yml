name: Build PWA

# The PWA is served from Cloudflare Pages, not GitHub Pages: the repository starts
# private, and GitHub Pages is not available to private repositories on the free
# plan. Cloudflare Pages builds from this repository through its own Git
# integration, so this workflow only produces and uploads the build for review
# and for the other jobs to reuse.
#
# The app is built with VITE_BASE=/readit/ so every asset, the router basename and
# the service worker live under that sub-path.
on:
  push:
    branches: [master]
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pwa
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No packageManager field in package.json, so pin the major here.
      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # The ORT runtime is generated from node_modules and is gitignored; the
      # ortAssets test verifies it, so copy it in before testing.
      - name: Copy ORT assets
        run: node scripts/copy-ort.mjs

      - name: Test
        run: pnpm test

      - name: Build (Pages sub-path)
        run: pnpm build
        env:
          VITE_BASE: /readit/

      # Cloudflare Pages has no SPA rewrite: a deep link such as /readit/read/abc
      # is served 404.html, which must be the app shell so the router can take over.
      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-artifact@v4
        with:
          name: pwa-dist
          path: dist
          retention-days: 14
