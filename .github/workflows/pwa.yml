name: Build PWA

# The PWA is published to GitHub Pages at /Read-IT/: the release's gh-pages
# branch holds the `dist` output at its root. This workflow builds and uploads
# that same bundle for review; promoting the artifact to gh-pages is a separate
# step so a green CI run never deploys by accident.
#
# VITE_BASE must match the live path: every asset URL, the router basename, the
# manifest scope and the service worker live under that sub-path.
on:
  push:
    branches: [master]
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pwa
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No packageManager field in package.json, so pin the major here.
      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # The ORT runtime is generated from node_modules and is gitignored; the
      # ortAssets test verifies it, so copy it in before testing.
      - name: Copy ORT assets
        run: node scripts/copy-ort.mjs

      - name: Test
        run: pnpm test

      - name: Build (Pages sub-path)
        run: pnpm build
        env:
          VITE_BASE: /Read-IT/

      # Cloudflare Pages has no SPA rewrite: a deep link such as /readit/read/abc
      # is served 404.html, which must be the app shell so the router can take over.
      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-artifact@v4
        with:
          name: pwa-dist
          path: dist
          retention-days: 14
