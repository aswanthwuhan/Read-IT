name: Licence guard

# Read IT ships no copyleft code. That is a licence promise, not a preference:
# the app is sold and carries advertising, so the whole point of the Apache-2.0
# relicensing (RELICENSING.md) is that nothing copyleft reaches the user's
# device. A dependency bump can break that silently, so it is checked here.
#
# The script fails the build on:
#   - any copyleft, source-available or non-commercial licence in the tree
#   - any reference to espeak-ng (GPL-3.0) anywhere in the source
#   - a sherpa-onnx Android archive older than 2.0.1 (which bundles espeak-ng)
#   - a non-commercial Pocket TTS voice being offered or fetched
#
# It also rewrites the generated dependency table in THIRD_PARTY_LICENSES.md.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: licence
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check licences
        run: node scripts/check-licences.mjs

      # The guard rewrites the generated table. The table is platform-dependent
      # for optional, platform-specific deps (e.g. sharp's `@img/sharp-*`
      # packages are installed per host OS, so the table the Linux CI guard
      # produces lists a few extra rows), so a diff is expected on Linux CI even
      # when everything is current. Report it instead of failing; the guard
      # itself (the licence enforcement) is the hard gate.
      - name: Inventory drift report
        run: |
          if git diff --quiet -- THIRD_PARTY_LICENSES.md; then
            echo "THIRD_PARTY_LICENSES.md is current."
          else
            echo "THIRD_PARTY_LICENSES.md changed during the guard run (expected for platform-specific deps). Commit the updated table." >&2
            git --no-pager diff --stat -- THIRD_PARTY_LICENSES.md
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: licence-report
          path: THIRD_PARTY_LICENSES.md
          retention-days: 30
